name: Pipeline CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ----------------------------------------------------
  # JOB 1 : Tests unitaires
  # ----------------------------------------------------
  test:
    name: 🧪 Job 1 - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Lancer pytest
        run: |
          pytest -v tests/

  # ----------------------------------------------------
  # JOB 2 : Construction & Export de l'image Docker
  # ----------------------------------------------------
  build-docker:
    name: 🐳 Job 2 - Docker Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: |
          docker build -t atelier-flask .

      - name: Sauvegarder l'image en fichier tar
        run: |
          docker save atelier-flask -o atelier-flask.tar

      - name: Transmettre l'image (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: image-docker
          path: atelier-flask.tar

  # ----------------------------------------------------
  # JOB 3 : Simulation de mise en production
  # ----------------------------------------------------
  deploy-prod:
    name: 🚀 Job 3 - Production
    needs: build-docker
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer l'artefact Docker
        uses: actions/download-artifact@v4
        with:
          name: image-docker

      - name: Charger l'image Docker
        run: |
          docker load -i atelier-flask.tar

      - name: Démarrer le conteneur
        run: |
          docker run -d -p 4000:4000 --name app-prod atelier-flask
          sleep 3

      - name: Vérifier que l'application répond
        run: |
          curl -f http://localhost:4000/ || exit 1

      - name: Résumé de la mise en production
        run: |
          echo "### 🚀 Déploiement en production réussi !" >> $GITHUB_STEP_SUMMARY
          echo "L'application Flask est en ligne et a répondu au test de disponibilité HTTP." >> $GITHUB_STEP_SUMMARY